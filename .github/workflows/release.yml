name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      - run: npm publish --access public --provenance

      - run: tar czf claude-kit-${{ github.ref_name }}.tar.gz --exclude=node_modules --exclude=.git .

      - uses: softprops/action-gh-release@v2
        with:
          files: claude-kit-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
